name: client-flutter

on:
  push:
    paths:
      - 'client-flutter/**'
      - '.github/workflows/client-flutter.yml'
  pull_request:
    paths:
      - 'client-flutter/**'
      - '.github/workflows/client-flutter.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test test_driver
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - run: flutter build linux --debug
